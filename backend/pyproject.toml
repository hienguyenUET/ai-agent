[project]
name = "ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langchain-tavily>=0.2.18",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
dev = "ai_agent.cli:dev"

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"
